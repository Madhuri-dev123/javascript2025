<html>
    <head>
        <style>
            #pwd{
                position: relative;
                display: inline-block
            }
           #eye{

            cursor: pointer;
           }

        </style>
    </head>
    <body>
        <h1 id="d1">Welcome to it industry</h1>
        <input type="text" id="d2" onkeyup="abc()">

            <span class="eye" onclick="xyz()">&#128065</span>
        </div>
        <br>

        <div>
        <input type="password" id="d4">

      </div> 
        <br>
        
        <button  onclick="check()">Click Me to change password..</button>

        <script>
           let x = document.getElementById("d1");
           let msg = x.innerHTML
           function abc(){
            let y = document.getElementById("d2");
            x.innerHTML="HI"+y.value+" ,"+msg
           }
           function xyz(e){
            var s = e.target.previousElementSibling;
            s.type=s.type==='password'?'text':'password'
                      }

           

           function check(){
            var s1 = document.getElementById('d3').value
            var s2 = document.getElementById("d4")
            if(s1!==s2){
                alert("please same password")
            }
           }
        </script>
    </body>
</html>
