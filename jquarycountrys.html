<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>
        #d1{
            display:flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        #d1 li {
            width: 200px;
            list-style: none;
            font-size: 20px;
            border: 1px solid;
            margin: 10px;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 10px 20px 10px;

        }
        
        #d1 li img{
            width: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <button onclick="getCountries()">Click Me</button>
    <ul id="d1">

    </ul>
    <script>
        function getCountries(){
         $.get(" https://restcountries.com/v3.1/all" ,function(countries,c){
            console.log(countries)
            countries.forEach(function(country){
               let newli = document.createElement("li")
               let cn = document.createElement("h5")
               cn.innerHTML=country.name.common;
               newli.appendChild(cn)
               let cp = document.createElement("div")
               cp.innerHTML="population:"+country.population;
               newli.appendChild(cp)
              let cc = document.createElement("div")
              cc.innerHTML="capital:"+country.capital
              newli.appendChild(cc)
               let flg = document.createElement("img")
               flg.src=country.flags.svg;
               newli.appendChild(flg)
               document.getElementById("d1").appendChild(newli)
            })   
         })
        }
    </script>
</body>
</html>
