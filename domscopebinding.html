<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="d1"></ul>
    <ul id="d2"></ul>

    <script>
     let arr = ["madhuri","vandhana","Rani"]
     let x = document.getElementById("d1")
     let z = document.getElementById("d2");
           for(var i=0;i<=arr.length-1;i++){
        let y = document.createElement("li");
        y.innerHTML=arr[i]
        y.onclick=function(){alert(i)}
        x.appendChild(y)
           }
           function genUI(){
           z.innerHTML=""
           arr.forEach(function(a,i){
            let y=document.createElement("li")
            y.innerHTML=a;

            let btn = document.createElement("button");
            btn.innerHTML="delete";
            y.appendChild(btn)
            btn.onclick=function(){arr.splice(i,1) ;genUI()}
            z.appendChild(y)
           })
        }
        genUI();
    </script>
</body>
</html>
